version: "1.3"
name: "SDC workflow manifest"
public_commands:
  - init
  - change
  - plan
  - apply
  - check
  - archive
  - harness
hidden_skills:
  - sdc-spec
  - sdc-implement
  - sdc-review
  - sdc-test
  - sdc-quality
  - sdc-validate
shared_references:
  - role-contracts.md
  - workflow-standards.md
  - discovery-gate.md
  - legacy-impact-gate.md
  - common-ground.md
  - expert-routing.md
  - artifact-output-contracts.md
  - execution-orchestration.md
  - runtime-context.md
  - artifact-schemas.md
  - delivery-gates.md
runtime_contract:
  helper: scripts/sdc-runtime-context.py
  states:
    - intake
    - discovery
    - confirmed
    - planned
    - applying
    - checking
    - archivable
  active_change_precedence:
    - explicit
    - environment
    - session
    - single-active
  durable:
    - state.json
    - apply-context.jsonl
    - check-context.jsonl
    - evidence/
    - revisions/
  ignored:
    - .sdc/runtime/sessions/
    - .sdc/runtime/<change-id>/research/
    - .sdc/runtime/<change-id>/evidence.jsonl
  rules:
    - "Resolve exactly one valid non-symlink active change or stop."
    - "Candidate recall and runtime evidence never become confirmed knowledge automatically."
    - "Client automation failure falls back to normal SDC stage instructions."
    - "Same-state retries are idempotent only with fresh evidence; explicit reopen preserves history and invalidates downstream approvals."
    - "Verify manifest schema/source hashes and revision-bound measured execution/review receipts before delivery."
flow:
  init:
    purpose: "Create or repair .sdc, seed knowledge, memory, common ground, expert routing, standards, and project cognition."
    inputs:
      - repository evidence
      - optional standards pack
      - user-provided project context
    outputs:
      - .sdc/constitution.md
      - .sdc/common-ground.md
      - .sdc/expert-routing.md
      - .sdc/project.md
      - .sdc/project-cognition.md
      - .sdc/knowledge/
      - .sdc/memory/
      - .sdc/standards/
      - .sdc/templates/
    gates:
      - "Do not invent product facts."
      - "Classify Brownfield/Legacy using evidence."
      - "Do not perform per-change impact analysis during init."
  change:
    purpose: "Run mandatory intake and discovery before creating final artifacts."
    state_transition: "materialize discovery after confirmed intake creates the minimal change artifacts"
    runtime_actions:
      - "Resolve an explicitly named change; never select by recency."
      - "Use Candidate recall and internal research routing only for evidence gathering."
    inputs:
      - user requirement
      - .sdc/common-ground.md
      - .sdc/knowledge/index.md
      - .sdc/expert-routing.md
    outputs:
      - discovery.md
      - optional draft proposal.md
      - brief notes.md
      - draft artifact output contract
    gates:
      - "Cover four intake categories with cited confirmation; ask only missing blocking questions and preserve write authorization."
      - "Keep artifacts minimal while Discovery Gate is open."
      - "High-impact decisions remain Proposed or Assumed until confirmed."
      - "Identify likely required outputs without generating final design artifacts."
  spec:
    purpose: "Convert confirmed discovery into SCN/REQ/AC with traceability."
    state_transition: "discovery -> confirmed after discovery closure and final spec pass; required impact is completed before planning"
    inputs:
      - confirmed discovery
      - established common ground
      - confirmed knowledge
      - decision ledger
    outputs:
      - spec.md
      - accepted artifact output contract
    gates:
      - "No OPEN Common Ground item may drive final REQ/AC/INV."
      - "No Proposed or Assumed decision may enter final requirements."
  plan:
    purpose: "Generate design, tasks, and context-pack from confirmed scope and impact."
    state_transition: "confirmed -> planned after Plan Preflight and both role manifests pass"
    runtime_actions:
      - "Generate deterministic apply-context.jsonl and check-context.jsonl."
      - "Preserve context-pack.md as the human-readable handoff."
    inputs:
      - confirmed spec.md
      - impact.md when required
      - .sdc/common-ground.md
      - .sdc/expert-routing.md
      - relevant knowledge and standards
    outputs:
      - design.md
      - tasks.md
      - context-pack.md
      - global constraints and passed plan preflight
      - diagrams, API/data contracts, test matrix, and release checklist when triggered
    gates:
      - "Select relevant expert profiles internally."
      - "Tasks must be traceable, test-first, and size S or M."
      - "Unconfirmed assumptions become investigation tasks or Stop-Line Reports."
      - "Triggered output artifacts must be present or explicitly N/A with evidence."
      - "Every task declares files, consumed/produced interfaces, expected verification, review status, and evidence."
      - "Plan Preflight must pass before apply."
  apply:
    purpose: "Implement planned tasks and record evidence."
    state_transition: "planned -> applying before edits; applying -> checking after all tasks and the whole-change review complete"
    runtime_actions:
      - "Use the apply role manifest and local session adapter when needed."
      - "Record actual verification receipts matching task Verify commands; ignored asserted evidence is not execution proof. Route research without promoting Candidate memory."
    inputs:
      - context-pack.md
      - tasks.md
      - spec.md
      - design.md
      - relevant knowledge and standards
    outputs:
      - code changes
      - notes.md
      - updated tasks.md
      - knowledge-candidates.md
      - project-local runtime brief/report/review packages and progress ledger
      - per-task dual-verdict review evidence
      - final whole-change review evidence
    gates:
      - "Do not implement from OPEN or high-impact WORKING Common Ground."
      - "Do not expand scope without updating plan/context-pack."
      - "Do not mark a task complete before Spec Compliance and Code Quality are approved."
      - "Reviewers are read-only and cannot be coached to suppress findings."
  check:
    purpose: "Combine validate, review, test, quality, impact, and knowledge drift checks."
    state_transition: "checking -> archivable only after every required gate passes"
    runtime_actions:
      - "Use the check role manifest and verify current hashes."
      - "Keep failed checks in checking state."
    inputs:
      - artifacts
      - actual diff
      - test/build/manual evidence
      - common ground
      - expert routing
    outputs:
      - readiness conclusion
      - findings
      - required fixes
      - knowledge compact recommendations
      - artifact output contract coverage
      - execution orchestration and whole-change review coverage
    gates:
      - "Traceability, decision, common-ground, and expert-profile gaps block delivery."
      - "Missing triggered output artifacts block delivery."
      - "Missing approved task reviews, unresolved Cannot verify items, or missing whole-change review block delivery."
  archive:
    purpose: "Preserve completed change and propose durable knowledge updates."
    state_transition: "require archivable before moving the completed change; preserve state.json in the archive"
    inputs:
      - completed checked change
      - final spec
      - validation evidence
      - knowledge candidates
    outputs:
      - .sdc/specs/<change-id>.md
      - .sdc/changes/archive/<change-id>/
      - archive.md
      - recommended durable updates
    gates:
      - "Required archive writes may proceed."
      - "Common Ground, expert routing, knowledge, memory, standards, decisions, AGENTS.md, project.md, and project-cognition updates require explicit confirmation."
